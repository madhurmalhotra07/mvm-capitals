<meta charset="utf-8"><title>MVM Tech</title><meta name="description" content="Technology &amp; AI solutions built for growth — web, mobile, and agentic AI for businesses across the UAE, UK, US, and India."><meta property="og:title" content="MVM Tech"><meta property="og:description" content="Web, mobile, and agentic AI solutions built for growth."><meta property="og:type" content="website"><meta property="og:url" content="https://mvmtech.in/"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com/"><link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap"> <style>
/* ============================================================
   MVM TECH — Daylight system, electric-blue accent
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#FFFFFF; color:#0A0A0C; overflow-x:hidden;
}
:root{
  --bg:#FFFFFF; --ink:#0A0A0C; --dim:#70737A; --soft:#F4F5F7; --line:#E7E8EB;
  --pill:#0A0A0C; --pill-fg:#FFFFFF; --acc:#2464E4;
  --dark:#0C0D10; --dark-fg:#F5F5F3; --dark-dim:#9EA0A6;
}
img,video{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:2px solid currentColor; outline-offset:3px}

/* ---------- nav ---------- */
.nav{
  position:fixed; inset:0 0 auto 0; z-index:900; height:64px;
  display:flex; align-items:center; padding:0 clamp(18px,3vw,36px);
  transition:background .35s ease, box-shadow .35s ease;
}
.nav.scrolled{background:rgba(255,255,255,.84); backdrop-filter:blur(18px) saturate(150%); box-shadow:0 1px 0 var(--line)}
.nav .mark{font-weight:700; font-size:21px; letter-spacing:-.04em; text-decoration:none}
.nav .mark span{color:var(--acc); font-weight:700}
.nav-links{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:24px}
.nav-links a{font-size:14.5px; font-weight:500; text-decoration:none; opacity:.82; transition:opacity .2s; padding:6px 0}
.nav-links a:hover{opacity:1}
.nav-links a.on{opacity:1; box-shadow:0 2px 0 var(--ink)}
.nav .cta{margin-left:auto}
.pill{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--pill); color:var(--pill-fg);
  font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  padding:12px 22px; border-radius:999px; text-decoration:none; border:0; cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
}
.pill:hover{transform:scale(1.035); box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
.pill .arr{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.pill:hover .arr{transform:translateX(3px)}
.pill.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
@media (max-width:960px){ .nav-links{display:none} }

/* ---------- scaffold ---------- */
.wrap{max-width:1290px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px)}
.sec{padding:clamp(80px,12vh,150px) 0}
.label{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0 0 clamp(26px,4vh,44px)}
.label::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--acc)}
h1.h,h2.h{font-size:clamp(34px,3.9vw,56px); font-weight:500; letter-spacing:-.04em; line-height:1.06; margin:0; text-wrap:balance}
.h .ghosted{color:var(--dim)}
.lede{font-size:clamp(16px,1.35vw,19px); line-height:1.55; color:var(--dim); max-width:56ch; margin:22px 0 0}
.lede b{color:var(--ink); font-weight:600}
.js .rv{opacity:0; transform:translateY(22px); will-change:transform,opacity}
.js .rv.in{opacity:1; transform:none; transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .95s cubic-bezier(.16,1,.3,1)}

/* ---------- hero sequence ---------- */
.heroseq{position:relative; height:300vh}
.heroseq-pin{position:sticky; top:0; height:100vh; min-height:640px; overflow:hidden; background:#EDEFF2}
.heroseq-pin video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.heroseq-pin .veil{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 62% 44% at 50% 44%, rgba(255,255,255,.55), rgba(255,255,255,.16) 58%, rgba(255,255,255,0) 82%)}
.hero-in{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:0 20px; will-change:transform,opacity;
}
.hero-in h1{font-size:clamp(46px,7.4vw,110px); font-weight:700; letter-spacing:-.028em; line-height:1.0; margin:0; text-wrap:balance; max-width:14ch}
.hero-in h1 .b{color:var(--acc)}
.hero-in .sub{font-size:clamp(15px,1.45vw,19px); margin:22px 0 0; color:#3E4046; max-width:58ch; line-height:1.5}
.hero-in .sub b{font-weight:600; color:var(--ink)}
.hero-in .pill{margin-top:34px; pointer-events:auto}
.rise-tower{
  position:absolute; left:50%; top:100%; z-index:3; width:min(54vw,560px);
  transform:translateX(-50%); transform-origin:50% 0; will-change:transform;
  border-radius:18px 18px 0 0; overflow:hidden;
  box-shadow:0 -30px 80px -30px rgba(20,40,90,.4);
}
.rise-tower img{width:100%; height:auto}
.rise-word{position:absolute; inset:0; z-index:4; display:grid; place-items:center; pointer-events:none; opacity:0}
.rise-word .big{
  font-weight:700; font-size:clamp(120px,26vw,400px); letter-spacing:-.02em; line-height:.9;
  color:transparent; -webkit-text-stroke:1.6px rgba(255,255,255,.95); text-align:center;
  filter:drop-shadow(0 2px 22px rgba(10,30,60,.30));
}
.rise-word .small{text-align:center; font-size:clamp(20px,3.8vw,50px); font-weight:600; letter-spacing:-.03em; color:rgba(255,255,255,.9); margin-top:-8px; text-shadow:0 2px 18px rgba(10,30,60,.4)}
.rise-fog{position:absolute; inset:auto 0 0 0; height:38%; z-index:5; pointer-events:none; opacity:0;
  background:linear-gradient(180deg, transparent, #FFFFFF 82%); will-change:opacity}

/* ---------- film ---------- */
.why-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(28px,4vw,64px); align-items:end; margin-bottom:clamp(36px,6vh,64px)}
@media (max-width:900px){ .why-grid{grid-template-columns:1fr} }
.film{position:relative; border-radius:22px; overflow:hidden; aspect-ratio:1290/720; background:var(--soft); will-change:transform; transform:scale(.94)}
.film video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.film .film-cap{
  position:absolute; left:18px; bottom:16px; z-index:2;
  font-size:12px; font-weight:600; letter-spacing:.02em;
  background:rgba(10,10,12,.55); color:#fff; backdrop-filter:blur(8px);
  padding:7px 13px; border-radius:999px;
}

/* manifesto fill */
.mani{font-size:clamp(26px,3.1vw,44px); font-weight:500; letter-spacing:-.035em; line-height:1.18; max-width:26ch; margin:0; text-wrap:balance}
.mani .w{color:var(--dim); transition:color .18s linear}
.mani .w.lit{color:var(--ink)}
.mani .w.half{color:#43454B}

/* rewired steps */
.rew{display:grid; grid-template-columns:1fr 1fr; gap:clamp(30px,5vw,80px); align-items:start}
@media (max-width:900px){ .rew{grid-template-columns:1fr} }
.rew h2.h{font-size:clamp(40px,4.6vw,66px)}
.rew .pill{margin-top:30px}
.steps{display:flex; flex-direction:column}
.step{padding:clamp(20px,3vh,30px) 0; border-top:1px solid var(--line); display:grid; grid-template-columns:52px 1fr; gap:16px; align-items:baseline}
.step:last-child{border-bottom:1px solid var(--line)}
.step .n{font-size:14px; font-weight:600; color:var(--acc); font-variant-numeric:tabular-nums}
.step h3{font-size:clamp(19px,1.8vw,24px); font-weight:600; letter-spacing:-.02em; margin:0 0 6px}
.step p{font-size:15.5px; line-height:1.55; color:var(--dim); margin:0; max-width:48ch}

/* principal dark band */
.principal{background:var(--dark); color:var(--dark-fg)}
.principal .label{color:var(--dark-fg)}
.pri-grid{display:grid; grid-template-columns:minmax(0,340px) 1fr; gap:clamp(30px,5vw,76px); align-items:center}
@media (max-width:900px){ .pri-grid{grid-template-columns:1fr} .pri-photo{max-width:300px} }
.pri-photo{aspect-ratio:798/1150; border-radius:18px; background-image:var(--portrait);
  background-size:cover; background-position:50% 8%; box-shadow:0 40px 90px -40px rgba(0,0,0,.8)}
.pri-body h2.h{color:var(--dark-fg)}
.pri-body .role{font-size:14px; font-weight:600; color:#C8CACF; margin:14px 0 22px}
.pri-body p{font-size:16px; line-height:1.62; color:var(--dark-dim); margin:0 0 16px; max-width:60ch}
.pri-body p b{color:var(--dark-fg); font-weight:600}
.pri-links{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px}
.pri-links .pill.ghost{color:var(--dark-fg); border-color:rgba(245,245,243,.4)}
.pri-links .pill.ghost:hover{border-color:var(--dark-fg)}

/* case studies */
.cases-head{display:flex; flex-wrap:wrap; gap:18px 32px; align-items:end; justify-content:space-between; margin-bottom:clamp(30px,5vh,50px)}
.cs-track{display:flex; gap:18px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 4px 22px; margin:0 -4px; scrollbar-width:thin}
.cs-card{
  flex:0 0 min(88vw,400px); scroll-snap-align:start;
  background:var(--soft); border-radius:20px; overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.cs-card:hover{transform:translateY(-4px)}
.cs-card .thumb{aspect-ratio:16/9; overflow:hidden}
.cs-card .thumb img{width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.cs-card:hover .thumb img{transform:scale(1.045)}
.cs-body{padding:clamp(20px,2.2vw,28px); display:flex; flex-direction:column; gap:12px; flex:1}
.cs-card .tag{align-self:flex-start; font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--acc);
  border:1px solid rgba(36,100,228,.3); background:var(--bg); padding:6px 12px; border-radius:999px}
.cs-card h3{font-size:clamp(18px,1.8vw,22px); font-weight:600; letter-spacing:-.025em; line-height:1.18; margin:0}
.cs-card p{font-size:14px; line-height:1.58; color:var(--dim); margin:0}
.cs-card .num{margin-top:auto; font-size:22px; font-weight:700; letter-spacing:-.03em; padding-top:8px}
.cs-note{font-size:12.5px; color:var(--dim); margin-top:8px}

/* solutions rows */
.sol-intro{max-width:56ch; margin-bottom:clamp(34px,5vh,56px)}
.sol{border-top:1px solid var(--line)}
.sol-row{display:grid; grid-template-columns:1fr minmax(0,44ch); gap:clamp(20px,4vw,70px);
  padding:clamp(28px,4vh,44px) 0; border-bottom:1px solid var(--line); align-items:center;
  text-decoration:none; transition:background .3s ease}
.sol-row:hover{background:rgba(244,245,247,.55)}
@media (max-width:900px){ .sol-row{grid-template-columns:1fr; gap:14px} }
.sol-row .big{font-size:clamp(34px,4.6vw,64px); font-weight:600; letter-spacing:-.045em; line-height:1; margin:0; transition:color .3s}
.sol-row:hover .big{color:var(--acc)}
.sol-row p{font-size:15.5px; line-height:1.6; color:var(--dim); margin:0}
.sol-row p b{color:var(--ink); font-weight:600}
.sol-cta{display:flex; flex-wrap:wrap; gap:16px 28px; align-items:center; margin-top:clamp(30px,5vh,46px)}
.sol-cta span{font-size:15.5px; color:var(--dim); max-width:44ch}

/* blog */
.blog-head{display:flex; flex-wrap:wrap; gap:18px 32px; align-items:end; justify-content:space-between; margin-bottom:clamp(28px,4.5vh,46px)}
.blog-list{border-top:1px solid var(--line)}
.post-row{display:grid; grid-template-columns:110px 1fr auto; gap:clamp(16px,3vw,44px);
  padding:clamp(22px,3.4vh,34px) 0; border-bottom:1px solid var(--line); align-items:baseline;
  text-decoration:none; transition:background .25s}
.post-row:hover{background:rgba(244,245,247,.55)}
.post-row time{font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
.post-row h3{font-size:clamp(19px,2vw,26px); font-weight:600; letter-spacing:-.025em; margin:0 0 6px; line-height:1.2}
.post-row p{font-size:14.5px; line-height:1.55; color:var(--dim); margin:0; max-width:64ch}
.post-row .arr{font-weight:600; transition:transform .25s}
.post-row:hover .arr{transform:translateX(4px)}
@media (max-width:720px){ .post-row{grid-template-columns:1fr} .post-row .arr{display:none} }

/* careers */
.career-band{background:var(--soft); border-radius:26px; overflow:hidden;
  display:grid; grid-template-columns:1fr 1fr; align-items:stretch}
@media (max-width:900px){ .career-band{grid-template-columns:1fr} }
.career-img{min-height:280px; background-size:cover; background-position:50% 40%}
.career-body{padding:clamp(28px,4vw,52px)}
.career-body h3{font-size:clamp(24px,2.6vw,36px); font-weight:600; letter-spacing:-.03em; margin:0 0 8px}
.career-body .open{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--acc); margin-bottom:18px}
.career-body .open::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--acc)}
.career-body p{font-size:15px; line-height:1.6; color:var(--dim); margin:0 0 22px; max-width:52ch}

/* closing */
.close-sec{text-align:center; padding:clamp(100px,17vh,190px) 0}
.close-sec h2{font-size:clamp(40px,6vw,88px); font-weight:700; letter-spacing:-.035em; line-height:1.02; margin:0 0 30px; text-wrap:balance; will-change:transform,opacity}

/* enquiry + footer */
.contact-band{background:var(--soft); border-radius:26px; padding:clamp(30px,4.5vw,60px);
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(30px,4.5vw,70px)}
@media (max-width:900px){ .contact-band{grid-template-columns:1fr} }
.contact-band h3{font-size:clamp(24px,2.5vw,34px); font-weight:600; letter-spacing:-.03em; margin:0 0 10px}
.contact-band .note{font-size:13px; color:var(--dim); margin:14px 0 0}
.f-form{display:grid; grid-template-columns:1fr 1fr; gap:12px} @media(max-width:600px){.f-form{grid-template-columns:1fr} .f-form .full{grid-column:1} .contact-band{border-radius:16px; padding:clamp(20px,4vw,40px)} .f-form textarea{min-height:90px}}
.f-form input{appearance:none; border:1px solid var(--line); background:var(--bg);
  font:inherit; font-size:15px; color:var(--ink); padding:14px 16px; border-radius:12px; transition:border-color .2s}
.f-form input::placeholder{color:var(--dim)}
.f-form input:focus{outline:none; border-color:var(--ink)}
.f-form .full{grid-column:1/-1}
.f-form .pill{grid-column:1/-1; justify-content:center; margin-top:6px}
.c-info{display:flex; flex-direction:column; gap:20px}
.c-info .blk h4{font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:0 0 8px}
.c-info .blk p,.c-info .blk a{font-size:15.5px; line-height:1.65; margin:0; text-decoration:none}
.footer{padding:clamp(40px,6vh,64px) 0 60px}
.foot-row{display:flex; flex-wrap:wrap; gap:14px 30px; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:28px}
.foot-row .fine{font-size:13px; color:var(--dim)}
.foot-row .links{display:flex; flex-wrap:wrap; gap:20px}
.foot-row .links a{font-size:13.5px; font-weight:500; text-decoration:none; color:var(--dim)}
.foot-row .links a:hover{color:var(--ink)}

/* inner pages */
.page-head{padding:clamp(150px,22vh,220px) 0 clamp(40px,6vh,70px)}
.page-head h1{font-size:clamp(42px,5.6vw,84px); font-weight:700; letter-spacing:-.035em; line-height:1.0; margin:0; text-wrap:balance}
.page-head .lede{max-width:60ch}
.svc{border-top:1px solid var(--line); padding:clamp(30px,4.5vh,48px) 0; display:grid; grid-template-columns:minmax(0,30ch) 1fr; gap:clamp(20px,4vw,64px)}
.svc:last-of-type{border-bottom:1px solid var(--line)}
@media (max-width:900px){ .svc{grid-template-columns:1fr; gap:12px} }
.svc h2{font-size:clamp(24px,2.6vw,34px); font-weight:600; letter-spacing:-.03em; margin:0; line-height:1.15}
.svc > p{font-size:15.5px; line-height:1.65; color:var(--dim); margin:0; max-width:66ch}
.svc > p b{color:var(--ink); font-weight:600}
.case-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px}
.case-big{background:var(--soft); border-radius:22px; overflow:hidden; display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.case-big:hover{transform:translateY(-4px)}
.case-big .thumb{aspect-ratio:16/9; overflow:hidden}
.case-big .thumb img{width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.case-big:hover .thumb img{transform:scale(1.04)}
.case-big .body{padding:clamp(22px,2.4vw,32px); display:flex; flex-direction:column; gap:12px; flex:1}
.case-big .tag{align-self:flex-start; font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--acc); border:1px solid rgba(36,100,228,.3); background:var(--bg); padding:6px 12px; border-radius:999px}
.case-big h3{font-size:clamp(19px,1.9vw,24px); font-weight:600; letter-spacing:-.025em; line-height:1.18; margin:0}
.case-big p{font-size:14.5px; line-height:1.6; color:var(--dim); margin:0}
.article{max-width:760px; margin:0 auto}
.article .meta{display:flex; gap:14px; align-items:center; font-size:14px; color:var(--dim); margin:18px 0 0}
.article .meta b{color:var(--ink); font-weight:600}
.article-hero{border-radius:22px; overflow:hidden; margin:clamp(28px,4.5vh,44px) 0}
.article-hero img{width:100%; height:auto}
.prose p{font-size:17px; line-height:1.72; color:#3E4046; margin:0 0 22px}
.prose p b{color:var(--ink)}
.back-link{display:inline-flex; gap:8px; align-items:center; font-size:14.5px; font-weight:600; text-decoration:none; margin-bottom:8px}
.quote{font-size:clamp(24px,2.8vw,40px); font-weight:500; letter-spacing:-.03em; line-height:1.25; max-width:30ch; margin:0; text-wrap:balance}
.quote .dim{color:var(--dim)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.chip{font-size:13px; font-weight:500; border:1px solid var(--line); border-radius:999px; padding:8px 15px; background:var(--bg)}

@media (prefers-reduced-motion: reduce){
  .js .rv{opacity:1 !important; transform:none !important; transition:none !important}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
:root{--portrait:url("assets/portrait.jpg")}

/* Mobile hamburger menu */
.ham-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none;z-index:1001}
.ham-btn span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:all .3s ease}
