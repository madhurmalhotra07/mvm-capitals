/* ============================================================
   MVM CAPITAL ADVISORS — Daylight
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#FFFFFF; color:#0A0A0C; overflow-x:hidden;
}
:root{
  --bg:#FFFFFF; --ink:#0A0A0C; --dim:#70737A; --soft:#F4F5F7; --line:#E7E8EB;
  --pill:#0A0A0C; --pill-fg:#FFFFFF; --acc:#0A0A0C;
  --dark:#0C0D10; --dark-fg:#F5F5F3; --dark-dim:#9EA0A6;
}
img,video{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:2px solid currentColor; outline-offset:3px}

/* ---------- nav ---------- */
.nav{
  position:fixed; inset:0 0 auto 0; z-index:900; height:64px;
  display:flex; align-items:center; padding:0 clamp(18px,3vw,36px);
  transition:background .35s ease, box-shadow .35s ease;
}
.nav.scrolled{background:rgba(255,255,255,.84); backdrop-filter:blur(18px) saturate(150%); box-shadow:0 1px 0 var(--line)}
.nav .mark{font-weight:700; font-size:21px; letter-spacing:-.04em; text-decoration:none}
.nav .mark span{color:var(--dim); font-weight:500}
.nav-links{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:26px}
.nav-links a{font-size:14.5px; font-weight:500; text-decoration:none; opacity:.82; transition:opacity .2s; padding:6px 0}
.nav-links a:hover{opacity:1}
.nav-links a.on{opacity:1; box-shadow:0 2px 0 var(--ink)}
.nav .cta{margin-left:auto}
.pill{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--pill); color:var(--pill-fg);
  font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  padding:12px 22px; border-radius:999px; text-decoration:none; border:0; cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
}
.pill:hover{transform:scale(1.035); box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
.pill .arr{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.pill:hover .arr{transform:translateX(3px)}
.pill.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
@media (max-width:900px){ .nav-links{display:none} }

/* ---------- shared scaffold ---------- */
.wrap{max-width:1290px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px)}
.sec{padding:clamp(80px,12vh,150px) 0}
.label{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0 0 clamp(26px,4vh,44px)}
.label::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--acc)}
h1.h,h2.h{font-size:clamp(34px,3.9vw,56px); font-weight:500; letter-spacing:-.04em; line-height:1.06; margin:0; text-wrap:balance}
.h .ghosted{color:var(--dim)}
.lede{font-size:clamp(16px,1.35vw,19px); line-height:1.55; color:var(--dim); max-width:56ch; margin:22px 0 0}
.lede b{color:var(--ink); font-weight:600}
.js .rv{opacity:0; transform:translateY(22px); will-change:transform,opacity}
.js .rv.in{opacity:1; transform:none; transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .95s cubic-bezier(.16,1,.3,1)}

/* ---------- hero sequence: video sky → tower rises through the headline → wordmark ---------- */
.heroseq{position:relative; height:300vh}
.heroseq-pin{position:sticky; top:0; height:100vh; min-height:640px; overflow:hidden; background:#BFD6EC}
.heroseq-pin video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.heroseq-pin .veil{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 62% 44% at 50% 44%, rgba(255,255,255,.62), rgba(255,255,255,.20) 58%, rgba(255,255,255,0) 82%)}
.hero-in{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:0 20px; will-change:transform,opacity;
}
.hero-in h1{font-size:clamp(46px,7.4vw,110px); font-weight:700; letter-spacing:-.028em; line-height:1.0; margin:0; text-wrap:balance; max-width:14ch}
.hero-in .sub{font-size:clamp(15px,1.45vw,19px); margin:22px 0 0; color:#3E4046; max-width:58ch; line-height:1.5}
.hero-in .sub b{font-weight:600; color:var(--ink)}
.hero-in .pill{margin-top:34px; pointer-events:auto}
.rise-tower{
  position:absolute; left:50%; top:100%; z-index:3; width:min(54vw,600px);
  transform:translateX(-50%); transform-origin:50% 0; will-change:transform;
  border-radius:18px 18px 0 0; overflow:hidden;
  box-shadow:0 -30px 80px -30px rgba(30,60,100,.35);
}
.rise-tower img{width:100%; height:auto}
.rise-word{position:absolute; inset:0; z-index:4; display:grid; place-items:center; pointer-events:none; opacity:0}
.rise-word .big{
  font-weight:700; font-size:clamp(120px,26vw,400px); letter-spacing:-.02em; line-height:.9;
  color:transparent; -webkit-text-stroke:1.6px rgba(255,255,255,.95); text-align:center;
  filter:drop-shadow(0 2px 22px rgba(10,30,60,.28));
}
.rise-word .small{text-align:center; font-size:clamp(18px,3.4vw,44px); font-weight:500; letter-spacing:-.03em; color:rgba(255,255,255,.88); margin-top:-8px; text-shadow:0 2px 18px rgba(10,30,60,.35)}
.rise-fog{position:absolute; inset:auto 0 0 0; height:38%; z-index:5; pointer-events:none; opacity:0;
  background:linear-gradient(180deg, transparent, #FFFFFF 82%); will-change:opacity}

/* scroll-linked text fill (FIND-style manifesto) */
.mani .w{color:var(--dim); transition:color .18s linear}
.mani .w.lit{color:var(--ink)}
.mani .w.half{color:#43454B}

/* film panel scroll scale-in */
.film{will-change:transform; transform:scale(.94); transition:none}

/* closing scale-in */
.close-sec h2{will-change:transform,opacity}

/* ---------- film panel ---------- */
.why-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(28px,4vw,64px); align-items:end; margin-bottom:clamp(36px,6vh,64px)}

.film{position:relative; border-radius:22px; overflow:hidden; aspect-ratio:1290/720; background:var(--soft)}

.film .film-cap{
  position:absolute; left:18px; bottom:16px; z-index:2;

  padding:7px 13px; border-radius:999px;
}

/* rewired steps */
.rew{display:grid; grid-template-columns:1fr 1fr; gap:clamp(30px,5vw,80px); align-items:start}

.step .n{font-size:14px; font-weight:600; color:var(--dim); font-variant-numeric:tabular-nums}

/* principal dark band */
.principal{background:var(--dark); color:var(--dark-fg)}

.pri-grid{display:grid; grid-template-columns:minmax(0,340px) 1fr; gap:clamp(30px,5vw,76px); align-items:center}
@media (max-width:900px){ .pri-grid{grid-template-columns:1fr} .pri-photo{max-width:300px} }

/* case studies */
.cases-head{display:flex; flex-wrap:wrap; gap:18px 32px; align-items:end; justify-content:space-between; margin-bottom:clamp(30px,5vh,50px)}
.cs-track{display:flex; gap:18px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 4px 22px; margin:0 -4px; scrollbar-width:thin}
.cs-card{

.cs-card h3{font-size:clamp(18px,1.8vw,22px); font-weight:600; letter-spacing:-.025em; line-height:1.18; margin:0}

.sol-row{display:grid; grid-template-columns:1fr minmax(0,44ch); gap:clamp(20px,4vw,70px);
  padding:clamp(30px,4.5vh,48px) 0; border-bottom:1px solid var(--line); align-items:center;
  text-decoration:none; transition:background .3s ease}

@media (max-width:900px){ .sol-row{grid-template-columns:1fr; gap:14px} }
.sol-row .big{font-size:clamp(38px,5vw,72px); font-weight:600; letter-spacing:-.045em; line-height:1; margin:0; transition:color .3s}
.sol-row p{font-size:15.5px; line-height:1.6; color:var(--dim); margin:0}
.sol-row p b{color:var(--ink); font-weight:600}
.sol-cta{display:flex; flex-wrap:wrap; gap:16px 28px; align-items:center; margin-top:clamp(30px,5vh,46px)}
.sol-cta span{font-size:15.5px; color:var(--dim); max-width:44ch}

/* beyond cards */
.bey-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px; margin-top:clamp(30px,5vh,48px)}
.bey-card{background:var(--soft); border-radius:20px; overflow:hidden; display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.bey-card:hover{transform:translateY(-4px)}
.bey-card .thumb{aspect-ratio:16/9; overflow:hidden}
.bey-card .thumb img{width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.bey-card:hover .thumb img{transform:scale(1.045)}
.bey-body{padding:clamp(20px,2.2vw,28px); display:flex; flex-direction:column; gap:10px; flex:1}
.bey-card h3{font-size:clamp(18px,1.8vw,22px); font-weight:600; letter-spacing:-.025em; margin:0; line-height:1.2}
.bey-card p{font-size:14px; line-height:1.58; color:var(--dim); margin:0}
.bey-card .lm{margin-top:auto; padding-top:8px; font-size:14.5px; font-weight:600; text-decoration:none; display:inline-flex; gap:8px; align-items:center}
.bey-card .lm .arr{transition:transform .25s}
.bey-card:hover .lm .arr{transform:translateX(3px)}

/* blog list */
.blog-head{display:flex; flex-wrap:wrap; gap:18px 32px; align-items:end; justify-content:space-between; margin-bottom:clamp(28px,4.5vh,46px)}
.blog-list{border-top:1px solid var(--line)}
.post-row{display:grid; grid-template-columns:110px 1fr auto; gap:clamp(16px,3vw,44px);
  padding:clamp(22px,3.4vh,34px) 0; border-bottom:1px solid var(--line); align-items:baseline;
  text-decoration:none; transition:background .25s}
.post-row:hover{background:rgba(244,245,247,.55)}
.post-row time{font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
.post-row h3{font-size:clamp(19px,2vw,26px); font-weight:600; letter-spacing:-.025em; margin:0 0 6px; line-height:1.2}
.post-row p{font-size:14.5px; line-height:1.55; color:var(--dim); margin:0; max-width:64ch}

.post-row:hover .arr{transform:translateX(4px)}

/* closing */
.close-sec{text-align:center; padding:clamp(100px,17vh,190px) 0}
.close-sec h2{font-size:clamp(40px,6vw,88px); font-weight:700; letter-spacing:-.035em; line-height:1.02; margin:0 0 30px; text-wrap:balance}

/* enquiry + footer */
.contact-band{background:var(--soft); border-radius:26px; padding:clamp(30px,4.5vw,60px);
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(30px,4.5vw,70px)}
@media (max-width:900px){ .contact-band{grid-template-columns:1fr} }
.contact-band h3{font-size:clamp(24px,2.5vw,34px); font-weight:600; letter-spacing:-.03em; margin:0 0 10px}

.f-form{display:grid; grid-template-columns:1fr 1fr; gap:12px} @media(max-width:600px){.f-form{grid-template-columns:1fr} .f-form .full{grid-column:1} .contact-band{border-radius:16px; padding:clamp(20px,4vw,40px)} .f-form textarea{min-height:90px}}

.f-form .pill{grid-column:1/-1; justify-content:center; margin-top:6px}

.foot-row .links{display:flex; flex-wrap:wrap; gap:20px}
.foot-row .links a{font-size:13.5px; font-weight:500; text-decoration:none; color:var(--dim)}
.foot-row .links a:hover{color:var(--ink)}

/* ---------- inner-page header ---------- */
.page-head{padding:clamp(150px,22vh,220px) 0 clamp(40px,6vh,70px)}
.page-head h1{font-size:clamp(42px,5.6vw,84px); font-weight:700; letter-spacing:-.035em; line-height:1.0; margin:0; text-wrap:balance}

/* solutions detail */
.svc{border-top:1px solid var(--line); padding:clamp(30px,4.5vh,48px) 0; display:grid; grid-template-columns:minmax(0,30ch) 1fr; gap:clamp(20px,4vw,64px)}

.svc > p{font-size:15.5px; line-height:1.65; color:var(--dim); margin:0; max-width:66ch}

/* case studies page grid */
.case-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px}
.case-big{background:var(--soft); border-radius:22px; overflow:hidden; display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1)}

.case-big .body{padding:clamp(22px,2.4vw,32px); display:flex; flex-direction:column; gap:12px; flex:1}
.case-big .tag{align-self:flex-start; font-size:12px; font-weight:600; letter-spacing:.03em; border:1px solid var(--line); background:var(--bg); padding:6px 12px; border-radius:999px}
.case-big h3{font-size:clamp(19px,1.9vw,24px); font-weight:600; letter-spacing:-.025em; line-height:1.18; margin:0}
.case-big p{font-size:14.5px; line-height:1.6; color:var(--dim); margin:0}
.case-big .num{margin-top:auto; padding-top:8px; font-size:26px; font-weight:700; letter-spacing:-.03em}

/* blog article */
.article{max-width:760px; margin:0 auto}
.article .meta{display:flex; gap:14px; align-items:center; font-size:14px; color:var(--dim); margin:18px 0 0}

.article-hero{border-radius:22px; overflow:hidden; margin:clamp(28px,4.5vh,44px) 0}

ains.</p><p class="rv">Shaped by his years within the Big&nbsp;4 ecosystem, he places strong emphasis on client experience and satisfaction — delivered through an entrepreneurial, innovative approach to every engagement.</p><div class="pri-links rv"><a class="pill ghost" href="https://www.linkedin.com/in/madhurmalhotra">LinkedIn <span class="arr">→</span></a><a class="pill ghost" href="https://www.instagram.com/mvmcapitals">@mvmcapitals <span class="arr">→</span></a></div></div></div></div></section><section class="sec"><div class="wrap"><div class="cases-head"><div><p class="label rv">Select Case Studies</p><h2 class="h rv">The Work Speaks Instead.</h2></div><a class="pill ghost rv" href="#/case-studies">All Case Studies <span class="arr">→</span></a></div><div class="cs-track rv" tabindex="0" aria-label="Case studies — scroll horizontally"><article class="cs-card"><div class="thumb"><img src="assets/cranes.jpg" alt="Construction cranes against a blue sky" loading="lazy"></div><div class="cs-body"><span class="tag">Infrastructure Financing · UAE</span><h3>USD 380M of fund interest, structured to mandate.</h3><p>Strong interest from an international fund for a USD 380 million infrastructure financing raise — aligned with both the developer&rsquo;s growth plans and the fund&rsquo;s mandate.</p><span class="num">$380M</span></div></article><article class="cs-card"><div class="thumb"><img src="assets/dubai-marina.jpg" alt="Dubai skyline across the marina" loading="lazy"></div><div class="cs-body"><span class="tag">Debt Financing · UAE</span><h3>AIF interest for a USD 10M debt round.</h3><p>Successful interest from an Alternative Investment Fund for a USD 10 million debt financing round — structured for competitive terms and a strong strategic fit.</p><span class="num">$10M</span></div></article><article class="cs-card"><div class="thumb"><img src="assets/goa-coast.jpg" alt="Aerial view of the Goa coastline" loading="lazy"></div><div class="cs-body"><span class="tag">Jo n></template><template id="t-solutions"><section class="page-head"><div class="wrap"><p class="label rv">Our Advisory Solutions</p><h1 class="rv">Everything a Deal Needs, <span style="color:var(--dim)">Under One Desk.</span></h1><p class="lede rv">Structuring capital, building partnerships, and delivering value for real estate and investment stakeholders across the UAE, UK, and India.</p></div></section><section class="sec" style="padding-top:clamp(20px,4vh,40px)"><div class="wrap"><div class="svc rv"><h2>Real Estate<br>Advisory</h2><div class="svc-items"><div class="svc-item"><h3>Joint Venture Transactions</h3><p>Matchmaking landowners and developers for mutually beneficial partnerships.</p></div><div class="svc-item"><h3>Land Feasibility</h3><p>Feasibility assessments and advisory support for developers and builders evaluating land acquisitions and development opportunities.</p></div><div class="svc-item"><h3>Branded Residences Collaborations</h3><p>Enabling strategic alliances between developers and global brands to create branded residences and integrated lifestyle communities.</p></div><div class="svc-item"><h3>Interior Fit-Out Solutions</h3><p>Specialised services spanning marble, lighting, swimming pools, landscaping, and luxury interior/exterior enhancements for residential and commercial spaces.</p></div><div class="svc-item"><h3>Underwriting Solutions</h3><p>Facilitating alignment between underwriters and developers, identifying suitable opportunities and enabling efficient deal matchmaking.</p></div><div class="svc-item"><h3>Buy / Sell / Lease</h3><p>Residential (apartments, land, villas, townhouses, mansions), Commercial (hotels, office spaces), and Retail (dark stores, grocery stores, and more).</p></div></div></div><div class="svc rv"><h2>Fundraising &amp;<br>Infrastructure Financing</h2><div class="svc-items"><div class="svc-item"><h3>Capital Structuring</h3><p>Supporting real estate developers and landowners in structuring and securing capital through diverse financing avenues, with a focus on quality partnerships and strategic capital alignment. Key partners include AIFs, NBFCs, sovereign funds, and fundraising platforms.</p></div><div class="svc-item"><h3>Joint Development Agreements</h3><p>Supporting developers with financial backing through Joint Development Agreements with financial institutions — giving the developer the credibility and resources of a recognised brand name, enabling stronger project delivery and investor confidence.</p></div></div></div><div class="svc rv"><h2>Risk<br>Advisory</h2><p>Governance, Risk &amp; Compliance (GRC) solutions, including internal audits, and process and policy design, together with Internal Financial Controls testing — covering both <b>test of design</b> and <b>test of operating effectiveness</b>.</p></div><div class="svc rv"><h2>Tech &amp; Digital<br>Advisory</h2><p>We also work with clients on a range of technology and AI-driven solutions. <b>Visit <a href="tech/index.html" style="text-decoration:underline">MVM Tech</a> to explore the products and platforms we&rsquo;re building.</b></p></div><div class="sol-cta rv" style="margin-top:clamp(36px,6vh,56px)"><a class="pill" href="#/contact">Discuss Your Requirement <span class="arr">→</span></a><span>Alliance partners across the UAE, US, and UK.</span></div></div></section></template><template id="t-cases"><section class="page-head"><div class="wrap"><p class="label rv">Select Case Studies</p><h1 class="rv">The Work<br>Speaks Instead.</h1><p class="lede rv">Real engagements, real outcomes — delivered across the UAE and India.*</p></div></section><section class="sec" style="padding-top:clamp(20px,4vh,40px)"><div class="wrap"><div class="case-grid"><article class="case-big rv"><div class="thumb"><img src="assets/cranes.jpg" alt="Construction cranes against a blue sky" loading="lazy"></div><div class="body"><span class="tag">Infrastructure Financing · UAE</span><h3>Infrastructure Financing — UAE</h3><p>MVM Capital Advisors supported a⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ UAE-based real estate developer in securing strong interest from an international fund for a USD 380 million infrastructure financing raise, structuring the opportunity to align with both the developer&rsquo;s growth plans and the fund&rsquo;s investment mandate.</p><span class="num">$380M</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/dubai-marina.jpg" alt="Dubai skyline across the marina" loading="lazy"></div><div class="body"><span class="tag">Debt Financing · UAE</span><h3>Debt Financing — UAE</h3><p>We supported a UAE real⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ estate developer in generating successful interest from an Alternative Investment Fund (AIF) for a USD 10 million debt financing round, structuring the engagement to secure competitive terms and a strong strategic fit for the developer&rsquo;s capital needs.</p><span class="num">$10M</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/goa-coast.jpg" alt="Aerial view of the Goa coastline" loading="lazy"></div><div class="body"><span class="tag">Joint Venture · Goa, India</span><h3>Joint Venture Transaction — Goa</h3><p>In Goa, India, MVM Capital⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ Advisors facilitated a successful joint venture between a developer and a landowner, structuring a partnership to develop 15 ultra-luxury apartments — aligning both parties&rsquo; interests to unlock the land&rsquo;s full potential.</p><span class="num">15 units</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/warehouse.jpg" alt="Warehouse aisle with racked inventory" loading="lazy"></div><div class="body"><span class="tag">Site Strategy · E-commerce</span><h3>Dark Store Site Identification</h3><p>MVM Capital Advisors identified strategic⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ dark store locations for a leading e-commerce platform, enabling faster, more reliable fulfilment of grocery orders across key catchment areas and supporting the client&rsquo;s last-mile delivery expansion.</p><span class="num">Last-mile</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/hotel-courtyard.jpg" alt="Palm-lined hotel courtyard with fountain" loading="lazy"></div><div class="body"><span class="tag">Transaction · Hotel Residences</span><h3>Hotel Residences Transaction</h3><p>We supported the successful sale⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ of a hotel residences development, structuring the transaction to deliver the new owner a fixed annual return of approximately 9–10% — combining strong asset selection with disciplined deal structuring.</p><span class="num">9–10% p.a.</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/ai-network.jpg" alt="Abstract network graphic" loading="lazy"></div><div class="body"><span class="tag">AI Operations · India</span><h3>AI-Run Policies &amp; Processes — India</h3><p>MVM Capital Advisors developed policies,⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ procedures, and processes for a real estate developer in India, designed for minimal human intervention and run by an AI agent — improving consistency, compliance, and operational efficiency.</p><span class="num">AI-run</span></div></article><article class="case-big rv"><div class="thumb"><img src="assets/infinity-pool.jpg" alt="Infinity pool edge meeting a city skyline" loading="lazy"></div><div class="body"><span class="tag">Fit-Out · Dubai Hills</span><h3>Sunken Pool &amp; Landscaping — Dubai Hills</h3><p>In Dubai Hills, MVM Capital⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ Advisors connected our client with the right partner for a premium sunken pool installation, complete with comprehensive landscaping and custom outdoor seating areas — elevating the property&rsquo;s outdoor living experience.</p><span class="num">Dubai Hills</span></div></article></div><p class="cs-note rv" style="margin-top:20px">*Client names have been withheld in line with confidentiality clauses / NDAs.</p></div></section></template><template id="t-blog"><section class="page-head"><div class="wrap"><p class="label rv">Blog &amp; Resources</p><h1 class="rv">Insights, Written<br>from the Desk.</h1><p class="lede rv">On real estate, financing, and technology — written by Madhur Malhotra.</p></div></section><section class="sec" style="padding-top:clamp(20px,4vh,40px)"><div class="wrap"><div class="blog-list rv" data-blog-index></div></div></section></template><template id="t-about"><section class="page-head"><div class="wrap"><p class="label rv">About Us</p><h1 class="rv">A Cross-Border Practice, <span style="color:var(--dim)">Built to Deliver.</span></h1><p class="lede rv">MVM Capital Advisors is a⁠​‌​​‌‌​‌​‌​‌​‌‌​​‌​​‌‌​‌​​‌​‌‌​‌​​‌‌​​​​​​‌‌‌​​‌​​‌‌​​‌​​​‌‌​​​‌​​‌​‌‌​‌​‌​​​​​‌​‌‌‌‌‌​​​‌‌​​‌​​​‌‌​​​‌​​​‌‌‌​​​​​‌‌​‌‌‌​​‌‌‌​​‌​‌‌​​​‌‌​‌‌​​​‌​​​‌‌‌​​​⁠ cross-border advisory practice with active clients across the US, UAE, UK, and India — focused on delivering diverse advisory solutions across Real Estate, Technology, Finance, and more.</p></div></section><section class="sec" style="padding-top <script>
(function(){
  function attach(btn){
    if(btn._mvmDone)return;btn._mvmDone=true;
    btn.addEventListener('click',async function(e){
      e.preventDefault();e.stopImmediatePropagation();
      var form=btn.closest('form');
      if(!form)return;
      if(form.reportValidity && !form.reportValidity())return;
      var orig=btn.innerHTML;
      btn.innerHTML='Sending...';btn.disabled=true;
      try{
        var res=await fetch('https://formspree.io/f/mwlpknwl',{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
        if(res.ok){form.innerHTML='<p style="font-size:16px;font-weight:600;padding:20px 0;text-align:center">Thank you! We will be in touch shortly.</p>';}
        else throw new Error();
      }catch(err){
        btn.innerHTML=orig;btn.disabled=false;
        alert('Something went wrong. Please email mm@mvmcapitals.in directly.');
      }
    },true);
  }
  function scan(){document.querySelectorAll('button[data-send]').forEach(attach);}
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();
</script>
